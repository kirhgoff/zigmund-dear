[tools]
bun = "1.4.4"
hk = "2.8.1"
pkl = "0.32.2"
betterleaks = "1.9.0"
typos = "1.51.1"
actionlint = "1.7.12"
zizmor = "1.31.1"
"github:agent-sh/agnix" = "0.59.2"

[tasks.setup]
description = "Install dependencies and the git hooks"
run = ["bun install --frozen-lockfile", "hk install"]

[tasks.check]
description = "Run every check, the same set CI runs"
run = "hk check --all"

[tasks.fix]
description = "Apply the automatic fixes"
run = "hk fix --all"
